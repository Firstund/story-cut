[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-cut"
version = "0.2.1"
description = "Local-first game/stream video auto-edit (story, highlight, combat, silence cut, shorts) that writes an OpenReel edit draft, with a phone-friendly web UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Firstund" }]
dependencies = [
  "scenedetect[opencv]>=0.6.4",
  "faster-whisper>=1.0.3",
  "httpx>=0.27",
  "numpy>=1.24",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "qrcode>=7.4",
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7"]
dev = ["pytest>=8"]

[project.scripts]
story-cut = "story_cut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
story_cut = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
